services:
  # Web service for backend and frontend
  - type: web
    name: globalservices-website
    env: node
    buildCommand: node build-render.js
    startCommand: node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: globalservices-db
          property: connectionString

databases:
  # PostgreSQL database
  - name: globalservices-db
    databaseName: globalservices
    user: globalservices_user
    plan: free
