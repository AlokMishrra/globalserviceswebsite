services:
  # Web service for backend and frontend
  - type: web
    name: globalservices-website
    env: node
    buildCommand: npm install && node render-vite-build.js
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: globalservices-db
          property: connectionString

databases:
  # PostgreSQL database
  - name: globalservices-db
    databaseName: globalservices
    user: globalservices_user
    plan: free
